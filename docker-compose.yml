services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: air_roam
      POSTGRES_USER: air_roam
      POSTGRES_PASSWORD: air_roam
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  pgdata:
