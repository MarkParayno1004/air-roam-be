          readOnly: true
        scope:
          type: string
          readOnly: true
        region:
          $ref: '#/components/schemas/RegionEnum'
        tag:
          type: string
          nullable: true
          maxLength: 50
        is_featured:
          type: boolean
        data_mb:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        validity_days:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        pricing_unit:
          $ref: '#/components/schemas/PricingUnitEnum'
        product_type:
          type: string
        product_name:
          type: string
      required:
      - countries
      - id
      - name
      - price
      - product_name
      - product_type
      - region
      - scope
