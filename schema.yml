components:
  schemas:
    AccessToken:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        destination_country_codes:
          type: array
          items:
            type: string
            maxLength: 2
          readOnly: true
        start_at:
          type: string
          format: date-time
          readOnly: true
        end_at:
          type: string
          format: date-time
          readOnly: true
        booking_status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - booking_status
      - created_at
      - destination_country_codes
      - end_at
      - id
      - start_at
      - updated_at
    BookingDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        destination_country_codes:
          type: array
          items:
            type: string
            maxLength: 2
          readOnly: true
        start_at:
          type: string
          format: date-time
          readOnly: true
        end_at:
          type: string
          format: date-time
          readOnly: true
        booking_status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        order_id:
          type: string
          format: uuid
          readOnly: true
        order_line_id:
          type: string
          format: uuid
          readOnly: true
        variant_name:
          type: string
          readOnly: true
        product_type:
          type: string
          readOnly: true
        pricing_unit:
          type: string
          readOnly: true
        countries:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - booking_status
      - countries
      - created_at
      - destination_country_codes
      - end_at
      - id
      - order_id
      - order_line_id
      - pricing_unit
      - product_type
      - start_at
      - updated_at
      - variant_name
    BookingInput:
      type: object
      properties:
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        destination_country_codes:
          type: array
          items:
            type: string
            maxLength: 2
      required:
      - end_at
      - start_at
    BookingStatusEnum:
      enum:
      - pending
      - confirmed
      - active
      - completed
      - cancelled
      type: string
      description: |-
        * `pending` - Pending
        * `confirmed` - Confirmed
        * `active` - Active
        * `completed` - Completed
        * `cancelled` - Cancelled
    Checkout:
      type: object
      properties:
        client:
          allOf:
          - $ref: '#/components/schemas/ClientEnum'
          default: web
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutLine'
      required:
      - lines
    CheckoutLine:
      type: object
      properties:
        variant_id:
          type: string
          format: uuid
        quantity:
          type: integer
          maximum: 10
          minimum: 1
        expected_unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        destination_country_codes:
          type: array
          items:
            type: string
            maxLength: 2
      required:
      - expected_unit_price
      - quantity
      - variant_id
    CheckoutResponse:
      type: object
      properties:
        order:
          $ref: '#/components/schemas/Order'
        invoice_url:
          type: string
          format: uri
        price_updates:
          type: array
          items:
            $ref: '#/components/schemas/PriceUpdate'
        removed_lines:
          type: array
          items:
            $ref: '#/components/schemas/RemovedLine'
      required:
      - invoice_url
      - order
      - price_updates
      - removed_lines
    ClientEnum:
      enum:
      - web
      - app
      type: string
      description: |-
        * `web` - Web
        * `app` - App
    CsrfToken:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    Destination:
      type: object
      properties:
        country_code:
          type: string
        country_name:
          type: string
        slug:
          type: string
        region:
          type: string
        from_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        multi_country_pack_count:
          type: integer
      required:
      - country_code
      - country_name
      - from_price
      - multi_country_pack_count
      - region
      - slug
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        order_status:
          allOf:
          - $ref: '#/components/schemas/OrderStatusEnum'
          readOnly: true
        client:
          allOf:
          - $ref: '#/components/schemas/ClientEnum'
          readOnly: true
        currency:
          type: string
          readOnly: true
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        xendit_invoice_url:
          type: string
          format: uri
          readOnly: true
          nullable: true
        paid_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
          readOnly: true
      required:
      - client
      - created_at
      - currency
      - id
      - lines
      - order_status
      - paid_at
      - total_amount
      - updated_at
      - xendit_invoice_url
    OrderCustomer:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        contact_no:
          type: string
      required:
      - contact_no
      - email
      - first_name
      - id
      - last_name
    OrderLine:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        product_variant:
          type: string
          format: uuid
          readOnly: true
        product_name_snapshot:
          type: string
          readOnly: true
        variant_name_snapshot:
          type: string
          readOnly: true
        product_type_snapshot:
          type: string
          readOnly: true
        pricing_unit_snapshot:
          type: string
          readOnly: true
        countries_snapshot:
          type: array
          items:
            type: string
            maxLength: 2
          readOnly: true
        quantity:
          type: integer
          readOnly: true
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        rental_days:
          type: integer
          readOnly: true
          nullable: true
        line_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        booking:
          allOf:
          - $ref: '#/components/schemas/Booking'
          nullable: true
          readOnly: true
      required:
      - booking
      - countries_snapshot
      - id
      - line_total
      - pricing_unit_snapshot
      - product_name_snapshot
      - product_type_snapshot
      - product_variant
      - quantity
      - rental_days
      - unit_price
      - variant_name_snapshot
    OrderStatusEnum:
      enum:
      - pending_payment
      - paid
      - fulfilled
      - cancelled
      - expired
      - refunded
      type: string
      description: |-
        * `pending_payment` - Pending Payment
        * `paid` - Paid
        * `fulfilled` - Fulfilled
        * `cancelled` - Cancelled
        * `expired` - Expired
        * `refunded` - Refunded
    Pack:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        countries:
          type: array
